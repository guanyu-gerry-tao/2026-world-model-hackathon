<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CityWalk</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: #000; overflow: hidden; }
      canvas { display: block; }

      #loading {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-family: sans-serif;
        font-size: 18px;
        background: #000;
        z-index: 10;
        gap: 16px;
      }
      #loading-bar-wrap {
        width: 260px;
        height: 6px;
        background: #333;
        border-radius: 3px;
        overflow: hidden;
      }
      #loading-bar {
        height: 100%;
        width: 0%;
        background: #fff;
        border-radius: 3px;
        transition: width 0.2s ease;
      }

      /* VRButton gets injected by Three.js — keep it above canvas */
      #VRButton {
        z-index: 20 !important;
      }
    </style>
  </head>
  <body>
    <div id="loading">
      <span id="loading-text">Loading city…</span>
      <div id="loading-bar-wrap">
        <div id="loading-bar"></div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
